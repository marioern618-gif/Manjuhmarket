<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manjuh Market - Caja Registradora</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 10px; background-color: #f4f6f9; color: #111; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        
        /* Título Principal más Grande y Claro */
        h1 { text-align: center; color: #1a252f; font-size: 32px; margin-top: 10px; margin-bottom: 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .table-responsive { overflow-x: auto; border-radius: 8px; border: 2px solid #2c3e50; }
        table { width: 100%; border-collapse: collapse; }
        
        /* Encabezados de tabla con texto extra grande */
        th { background-color: #2c3e50; color: white; padding: 14px 10px; text-align: left; font-size: 16px; font-weight: bold; white-space: nowrap; }
        td { padding: 12px 8px; border-bottom: 2px solid #ccc; vertical-align: middle; }
        
        /* Inputs adaptados para baja interactividad y alta visibilidad */
        input, select { width: 100%; padding: 12px 8px; border: 2px solid #7f8c8d; border-radius: 6px; font-size: 16px; color: #000; font-weight: bold; height: 48px; }
        input:focus, select:focus { border-color: #2980b9; background-color: #e8f4f8; outline: none; }
        .total-row-input { background-color: #eaeded; font-weight: bold; border: 2px solid #bdc3c7; color: #2c3e50; }
        
        /* Controles de cantidad gigantes especiales para celulares */
        .quantity-control { display: flex; align-items: center; gap: 4px; min-width: 120px; }
        .btn-qty { background-color: #7f8c8d; color: white; border: none; width: 40px; height: 44px; font-size: 22px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-qty:active { background-color: #34495e; }
        .prod-cant { text-align: center; padding: 0; height: 44px; font-size: 18px; }

        /* Campos dinámicos con alerta visual amarilla suave para captar atención */
        .dinamico { display: none; }
        .visible { display: block; background-color: #fef9e7; border-color: #f39c12; }
        
        /* Sección de Totales ultra visible */
        .footer-section { display: flex; flex-direction: column; gap: 20px; margin-top: 25px; padding-top: 20px; border-top: 3px solid #2c3e50; }
        .totals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        
        .total-box { background: #f8f9fa; padding: 18px 10px; border-radius: 10px; border: 2px solid #bdc3c7; border-top: 8px solid #2c3e50; text-align: center; }
        .total-box.pago { border-top-color: #27ae60; background-color: #ebf5fb; border-color: #a9dfbf; }
        .total-box.pendiente { border-top-color: #c0392b; background-color: #fdedec; border-color: #f5b7b1; }
        
        .total-label { font-size: 15px; text-transform: uppercase; color: #2c3e50; font-weight: 900; letter-spacing: 0.5px; }
        .total-amount { font-size: 26px; font-weight: 900; color: #000; margin-top: 8px; display: block; }
        
        /* Botón de enviar gigante para pulsar fácil con el pulgar */
        .actions-row { display: flex; justify-content: center; margin-top: 15px; }
        button#btn-enviar { background-color: #27ae60; color: white; border: 2px solid #1e8449; padding: 18px 60px; font-size: 22px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; max-width: 500px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); height: 65px; }
        button#btn-enviar:hover { background-color: #219653; }
        button#btn-enviar:disabled { background-color: #bdc3c7; border-color: #95a5a6; cursor: not-allowed; }

        /* Ajustes específicos para pantallas de celular */
        @media (max-width: 768px) {
            h1 { font-size: 26px; }
            th { font-size: 14px; padding: 10px 5px; }
            td { padding: 10px 4px; }
            input, select { font-size: 15px; height: 45px; padding: 6px; }
            .btn-qty { width: 36px; height: 42px; font-size: 20px; }
            .prod-cant { height: 42px; font-size: 16px; }
            .totals-grid { grid-template-columns: 1fr; gap: 12px; }
            .total-box { padding: 15px; }
            .total-amount { font-size: 24px; }
            button#btn-enviar { font-size: 20px; height: 60px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Manjuh Market</h1>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 22%;">Producto</th>
                    <th style="width: 15%;">Cant.</th>
                    <th style="width: 11%;">Precio U.</th>
                    <th style="width: 11%;">Subtotal</th>
                    <th style="width: 11%;">Medio Pago</th>
                    <th style="width: 11%;">Tipo Pend.</th>
                    <th style="width: 11%;">Vlr. Pagado (Abono)</th>
                    <th style="width: 11%;">Vlr. Pendiente</th>
                    <th style="width: 13%;">Responsable</th>
                </tr>
            </thead>
            <tbody id="product-rows">
                </tbody>
        </table>
    </div>

    <div class="footer-section">
        <div class="totals-grid">
            <div class="total-box">
                <div class="total-label">Total a pagar</div>
                <div class="total-amount">$<span id="grand-total-val">0.00</span></div>
            </div>
            <div class="total-box pago">
                <div class="total-label">Total Pagado</div>
                <div class="total-amount">$<span id="total-pagado-val">0.00</span></div>
            </div>
            <div class="total-box pendiente">
                <div class="total-label">Total Pendiente (Fiado)</div>
                <div class="total-amount">$<span id="total-pendiente-val">0.00</span></div>
            </div>
        </div>
        
        <div class="actions-row">
            <button id="btn-enviar" onclick="enviarDatos()">Enviar Venta</button>
        </div>
    </div>
</div>

<script>
    // IMPORTANTE: Asegúrate de volver a colocar aquí tu enlace web de Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzAynOVbmwQDJXdPa0gQoOMxblSrSVZEOQd7Z1yLADHdcbCAWpq0hIKgOjxau6lYOf28Q/exec";

    // Generar 15 filas adaptadas
    const tbody = document.getElementById('product-rows');
    for (let i = 1; i <= 15; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="prod-name" placeholder="Ej. Arroz"></td>
            <td>
                <div class="quantity-control">
                    <button type="button" class="btn-qty" onclick="cambiarCantidad(this, -1)">-</button>
                    <input type="number" class="prod-cant" value="1" min="1" oninput="calcularFila(this)">
                    <button type="button" class="btn-qty" onclick="cambiarCantidad(this, 1)">+</button>
                </div>
            </td>
            <td><input type="number" class="prod-price" placeholder="0" min="0" oninput="calcularFila(this)"></td>
            <td><input type="text" class="prod-total total-row-input" value="0.00" readonly></td>
            <td>
                <select class="pay-type" onchange="manejarTipoPago(this)">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Nequi">Nequi</option>
                    <option value="Daviplata">Daviplata</option>
                    <option value="Pendiente">Pendiente</option>
                </select>
            </td>
            <td>
                <select class="pending-type dinamico" onchange="manejarTipoPendiente(this)">
                    <option value="Pendiente total">Pendiente Total</option>
                    <option value="Parcial">Parcial</option>
                </select>
            </td>
            <td>
                <input type="number" class="paid-value dinamico" placeholder="0" min="0" oninput="calcularValorDesdeAbono(this)" readonly>
            </td>
            <td>
                <input type="number" class="pending-value dinamico" value="0.00" readonly>
            </td>
            <td><input type="text" class="responsible-name" placeholder="Quién debe"></td>
        `;
        tbody.appendChild(tr);
    }

    // Nueva función accesible para cambiar cantidades sin usar teclado numérico menudo
    function cambiarCantidad(boton, cambio) {
        const input = boton.parentNode.querySelector('.prod-cant');
        let valorActual = parseInt(input.value) || 1;
        valorActual += cambio;
        if (valorActual < 1) valorActual = 1;
        input.value = valorActual;
        calcularFila(input);
    }

    function calcularFila(input) {
        const fila = input.closest('tr');
        const cant = parseFloat(fila.querySelector('.prod-cant').value) || 0;
        const precio = parseFloat(fila.querySelector('.prod-price').value) || 0;
        
        const totalFila = cant * precio;
        fila.querySelector('.prod-total').value = totalFila.toFixed(2);
        
        const tipoPago = fila.querySelector('.pay-type').value;
        const selectPendiente = fila.querySelector('.pending-type');
        
        if (tipoPago === "Pendiente") {
            if (selectPendiente.value === "Pendiente total") {
                fila.querySelector('.paid-value').value = (0).toFixed(2);
                fila.querySelector('.pending-value').value = totalFila.toFixed(2);
            } else {
                const abono = parseFloat(fila.querySelector('.paid-value').value) || 0;
                let saldoPendiente = totalFila - abono;
                if (saldoPendiente < 0) saldoPendiente = 0;
                fila.querySelector('.pending-value').value = saldoPendiente.toFixed(2);
            }
        }
        calcularGlobales();
    }

    function manejarTipoPago(select) {
        const fila = select.closest('tr');
        const selectPendiente = fila.querySelector('.pending-type');
        const inputPaid = fila.querySelector('.paid-value');
        const inputPending = fila.querySelector('.pending-value');
        const totalFila = parseFloat(fila.querySelector('.prod-total').value) || 0;

        if (select.value === "Pendiente") {
            selectPendiente.classList.add('visible');
            inputPaid.classList.add('visible');
            inputPending.classList.add('visible');
            
            selectPendiente.value = "Pendiente total";
            inputPaid.value = (0).toFixed(2);
            inputPaid.readOnly = true; 
            inputPending.value = totalFila.toFixed(2);
        } else {
            selectPendiente.classList.remove('visible');
            inputPaid.classList.remove('visible');
            inputPending.classList.remove('visible');
            inputPaid.value = "";
            inputPending.value = "0.00";
        }
        calcularGlobales();
    }

    function manejarTipoPendiente(select) {
        const fila = select.closest('tr');
        const inputPaid = fila.querySelector('.paid-value');
        const inputPending = fila.querySelector('.pending-value');
        const totalFila = parseFloat(fila.querySelector('.prod-total').value) || 0;

        if (select.value === "Pendiente total") {
            inputPaid.value = (0).toFixed(2);
            inputPaid.readOnly = true;
            inputPending.value = totalFila.toFixed(2);
        } else {
            inputPaid.value = "";
            inputPaid.readOnly = false;
            inputPending.value = totalFila.toFixed(2);
            inputPaid.focus();
        }
        calcularGlobales();
    }

    function calcularValorDesdeAbono(input) {
        const fila = input.closest('tr');
        const totalFila = parseFloat(fila.querySelector('.prod-total').value) || 0;
        const abono = parseFloat(input.value) || 0;
        
        let saldoPendiente = totalFila - abono;
        if(saldoPendiente < 0) saldoPendiente = 0;
        
        fila.querySelector('.pending-value').value = saldoPendiente.toFixed(2);
        calcularGlobales();
    }

    function calcularGlobales() {
        let granTotal = 0;
        let totalPendiente = 0;

        document.querySelectorAll('#product-rows tr').forEach(fila => {
            const totalFila = parseFloat(fila.querySelector('.prod-total').value) || 0;
            const tipoPago = fila.querySelector('.pay-type').value;
            const vlrPendiente = parseFloat(fila.querySelector('.pending-value').value) || 0;

            granTotal += totalFila;

            if (tipoPago === "Pendiente") {
                totalPendiente += vlrPendiente;
            }
        });

        let totalPagado = granTotal - totalPendiente;

        document.getElementById('grand-total-val').innerText = granTotal.toFixed(2);
        document.getElementById('total-pendiente-val').innerText = totalPendiente.toFixed(2);
        document.getElementById('total-pagado-val').innerText = totalPagado.toFixed(2);
    }

    async function enviarDatos() {
        const boton = document.getElementById('btn-enviar');
        const filas = document.querySelectorAll('#product-rows tr');
        let datosAEnviar = [];
        let validacionPasada = true;
        let tieneDatos = false;

        filas.forEach((fila, index) => {
            const producto = fila.querySelector('.prod-name').value.trim();
            const precioStr = fila.querySelector('.prod-price').value.trim();
            const cant = parseInt(fila.querySelector('.prod-cant').value) || 1;
            const total = parseFloat(fila.querySelector('.prod-total').value) || 0;
            const tipoPago = fila.querySelector('.pay-type').value;
            const tipoPendiente = tipoPago === "Pendiente" ? fila.querySelector('.pending-type').value : "N/A";
            
            const abono = tipoPago === "Pendiente" ? (parseFloat(fila.querySelector('.paid-value').value) || 0) : total;
            const vlrPendiente = tipoPago === "Pendiente" ? (parseFloat(fila.querySelector('.pending-value').value) || 0) : 0;
            const Starsponsable = fila.querySelector('.responsible-name').value.trim();

            if ((producto && !precioStr) || (!producto && precioStr)) {
                alert(`Error en fila ${index + 1}: Todo producto necesita precio y viceversa.`);
                validacionPasada = false; return;
            }

            if (producto && precioStr) {
                if (tipoPago === "Pendiente" && tipoPendiente === "Parcial" && abono > total) {
                    alert(`Error en fila ${index + 1}: El valor pagado (abono) no puede ser mayor que el total del producto.`);
                    validacionPasada = false; return;
                }
                
                if (tipoPago === "Pendiente" && !Starsponsable) {
                    alert(`Error en fila ${index + 1}: Si la cuenta queda Pendiente, debes escribir el Responsable.`);
                    validacionPasada = false; return;
                }

                tieneDatos = true;
                datosAEnviar.push({
                    producto: producto,
                    cantidad: cant,
                    precio_unitario: parseFloat(precioStr),
                    total: total,
                    tipo_pago: tipoPago,
                    tipo_pendiente: tipoPendiente,
                    valor_pendiente: vlrPendiente,
                    valor_pagado: abono,
                    responsable: Starsponsable || "N/A"
                });
            }
        });

        if (!validacionPasada || !tieneDatos) {
            if(!tieneDatos) alert("Ingresa al menos un producto válido.");
            return;
        }

        boton.disabled = true;
        boton.innerText = "Enviando datos...";

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ventas: datosAEnviar, fecha: new Date().toLocaleString() })
            });

            alert("¡Venta registrada con éxito en Manjuh Market!");
            document.querySelectorAll('input:not(.prod-cant):not(.prod-total)').forEach(i => i.value = '');
            document.querySelectorAll('.prod-cant').forEach(i => i.value = '1');
            document.querySelectorAll('.prod-total').forEach(i => i.value = '0.00');
            document.querySelectorAll('.pay-type').forEach(s => { s.value = 'Efectivo'; manejarTipoPago(s); });
            calcularGlobales();

        } catch (error) {
            alert("Error de conexión al enviar.");
            console.error(error);
        } finally {
            boton.disabled = false;
            boton.innerText = "Enviar Venta";
        }
    }
</script>
</body>
</html>
