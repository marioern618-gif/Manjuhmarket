<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manjuh Market - Caja Registradora</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 10px; background-color: #f4f6f9; color: #111; padding-top: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); position: relative; }
        
        h1 { text-align: center; color: #1a252f; font-size: 32px; margin-top: 10px; margin-bottom: 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        /* CUADRO FLOTANTE EMERGENTE - REVISADO Y MÁS GRANDE */
        .floating-total {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2c3e50;
            color: #fff;
            padding: 16px 22px; /* Más amplio */
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            z-index: 1000;
            text-align: center;
            border: 3px solid #fff; /* Borde más grueso para resaltar */
            transition: opacity 0.3s ease, transform 0.3s ease;
            min-width: 140px;
        }
        .floating-total .float-label { font-size: 13px; text-transform: uppercase; font-weight: 900; color: #ecf0f1; letter-spacing: 0.5px; }
        .floating-total .float-amount { font-size: 28px; font-weight: 900; color: #ffffff; margin-top: 5px; display: block; } /* Ahora blanco puro */
        
        /* Ocultar suavemente el flotante al llegar abajo */
        .floating-total.hidden { opacity: 0; pointer-events: none; transform: translateY(-10px); }

        /* Contenedor de las tarjetas de productos */
        .products-container { display: flex; flex-direction: column; gap: 20px; margin-bottom: 25px; }
        
        /* Tarjeta de producto vertical */
        .product-card { background: #ffffff; border: 3px solid #2c3e50; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-title { font-size: 16px; font-weight: bold; color: white; background: #2c3e50; margin: -15px -15px 15px -15px; padding: 8px 15px; border-top-left-radius: 6px; border-top-right-radius: 6px; text-transform: uppercase; }
        
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .form-row-half { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        
        label { font-size: 14px; font-weight: bold; color: #2c3e50; text-transform: uppercase; }
        
        input, select { width: 100%; padding: 10px; border: 2px solid #7f8c8d; border-radius: 6px; font-size: 16px; color: #000; font-weight: bold; height: 48px; }
        input:focus, select:focus { border-color: #2980b9; background-color: #e8f4f8; outline: none; }
        
        /* ENFASIS EXTRA GRANDE */
        .xl-label { font-size: 18px; color: #111; font-weight: 900; }
        .xl-input { height: 55px; font-size: 20px; border: 3px solid #111; }
        .total-row-input { background-color: #d5dbdb; font-weight: 900; color: #000; border: 3px solid #111; }
        .pay-type { border: 3px solid #2980b9; background-color: #f4f9fd; }

        /* Botones grandes de cantidad */
        .quantity-control { display: flex; align-items: center; gap: 4px; }
        .btn-qty { background-color: #7f8c8d; color: white; border: none; width: 45px; height: 48px; font-size: 24px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-qty:active { background-color: #34495e; }
        .prod-cant { text-align: center; padding: 0; height: 48px; font-size: 18px; }

        /* Bloques dinámicos de crédito */
        .dinamico-block { display: none; background-color: #fef9e7; border: 2px dashed #f39c12; padding: 10px; border-radius: 8px; margin-top: 10px; }
        .visible-block { display: flex; flex-direction: column; gap: 12px; }
        
        /* Totales del Footer */
        .footer-section { display: flex; flex-direction: column; gap: 20px; margin-top: 25px; padding-top: 20px; border-top: 4px solid #2c3e50; }
        .totals-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        
        .total-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border: 2px solid #bdc3c7; border-top: 8px solid #2c3e50; text-align: center; }
        .total-box.pago { border-top-color: #27ae60; background-color: #ebf5fb; border-color: #a9dfbf; }
        .total-box.pendiente { border-top-color: #c0392b; background-color: #fdedec; border-color: #f5b7b1; }
        
        .total-label { font-size: 15px; text-transform: uppercase; color: #2c3e50; font-weight: 900; }
        .total-amount { font-size: 26px; font-weight: 900; color: #000; margin-top: 8px; display: block; }
        
        /* Botón de Enviar */
        .actions-row { display: flex; justify-content: center; margin-top: 10px; }
        button#btn-enviar { background-color: #27ae60; color: white; border: 2px solid #1e8449; padding: 15px; font-size: 22px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 8px rgba(0,0,0,0.2); height: 65px; }
        button#btn-enviar:disabled { background-color: #bdc3c7; border-color: #95a5a6; cursor: not-allowed; }

        @media (max-width: 768px) {
            .floating-total { top: 12px; right: 12px; padding: 12px 16px; min-width: 120px; }
            .floating-total .float-amount { font-size: 24px; }
        }
    </style>
</head>
<body>

<div id="popup-floating" class="floating-total">
    <div class="float-label">Total a Pagar</div>
    <div class="float-amount">$<span id="float-total-val">0</span></div>
</div>

<div class="container">
    <h1>Manjuh Market</h1>
    
    <div id="products-container" class="products-container"></div>

    <div class="footer-section" id="footer-section">
        <div class="totals-grid">
            <div class="total-box">
                <div class="total-label">Total a pagar</div>
                <div class="total-amount">$<span id="grand-total-val">0</span></div>
            </div>
            <div class="total-box pago">
                <div class="total-label">Total Pagado</div>
                <div class="total-amount">$<span id="total-pagado-val">0</span></div>
            </div>
            <div class="total-box pendiente">
                <div class="total-label">Total Pendiente (Fiado)</div>
                <div class="total-amount">$<span id="total-pendiente-val">0</span></div>
            </div>
        </div>
        
        <div class="actions-row">
            <button id="btn-enviar" onclick="enviarDatos()">Enviar Venta</button>
        </div>
    </div>
</div>

<script>
    // IMPORTANTE: Recuerda pegar tu enlace de Google Apps Script dentro de las comillas de abajo
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzAynOVbmwQDJXdPa0gQoOMxblSrSVZEOQd7Z1yLADHdcbCAWpq0hIKgOjxau6lYOf28Q/exec";

    function formatearCop(valor) {
        return Math.round(valor).toLocaleString('es-CO', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });
    }

    const container = document.getElementById('products-container');
    for (let i = 1; i <= 15; i++) {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
            <div class="card-title">Producto #${i}</div>
            
            <div class="form-group">
                <label class="xl-label">Nombre del Producto</label>
                <input type="text" class="prod-name xl-input" placeholder="Ej. Arroz, Leche...">
            </div>
            
            <div class="form-row-half">
                <div class="form-group">
                    <label>Cantidad</label>
                    <div class="quantity-control">
                        <button type="button" class="btn-qty" onclick="cambiarCantidad(this, -1)">-</button>
                        <input type="number" class="prod-cant" value="1" min="1" oninput="calcularFila(this)">
                        <button type="button" class="btn-qty" onclick="cambiarCantidad(this, 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Precio Unitario</label>
                    <input type="number" class="prod-price" placeholder="0" min="0" oninput="calcularFila(this)">
                </div>
            </div>
            
            <div class="form-group">
                <label class="xl-label">Subtotal</label>
                <input type="text" class="prod-total xl-input total-row-input" value="0" readonly>
            </div>
            
            <div class="form-group">
                <label class="xl-label">Medio de Pago</label>
                <select class="pay-type xl-input" onchange="manejarTipoPago(this)">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Nequi">Nequi</option>
                    <option value="Daviplata">Daviplata</option>
                    <option value="Pendiente">Pendiente</option>
                </select>
            </div>
            
            <div class="dinamico-block">
                <div class="form-group">
                    <label>Tipo de Pendiente</label>
                    <select class="pending-type" onchange="manejarTipoPendiente(this)">
                        <option value="Pendiente total">Pendiente Total</option>
                        <option value="Parcial">Parcial</option>
                    </select>
                </div>
                
                <div class="form-row-half" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label>Valor Pagado (Abono)</label>
                        <input type="number" class="paid-value" placeholder="0" min="0" oninput="calcularValorDesdeAbono(this)" readonly>
                    </div>
                    <div class="form-group">
                        <label>Valor Pendiente</label>
                        <input type="text" class="pending-value" value="0" readonly style="background-color: #eaeded; font-weight: bold;">
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 12px; margin-bottom: 0;">
                    <label>Responsable (Quién debe)</label>
                    <input type="text" class="responsible-name" placeholder="Nombre del cliente">
                </div>
            </div>
        `;
        container.appendChild(card);
    }

    function cambiarCantidad(boton, cambio) {
        const input = boton.parentNode.querySelector('.prod-cant');
        let valorActual = parseInt(input.value) || 1;
        valorActual += cambio;
        if (valorActual < 1) valorActual = 1;
        input.value = valorActual;
        calcularFila(input);
    }

    function calcularFila(input) {
        const card = input.closest('.product-card');
        const cant = parseFloat(card.querySelector('.prod-cant').value) || 0;
        const precio = parseFloat(card.querySelector('.prod-price').value) || 0;
        
        const totalFila = Math.round(cant * precio);
        card.querySelector('.prod-total').value = formatearCop(totalFila);
        
        const tipoPago = card.querySelector('.pay-type').value;
        const selectPendiente = card.querySelector('.pending-type');
        
        if (tipoPago === "Pendiente") {
            if (selectPendiente.value === "Pendiente total") {
                card.querySelector('.paid-value').value = 0;
                card.querySelector('.pending-value').value = formatearCop(totalFila);
            } else {
                const abono = Math.round(parseFloat(card.querySelector('.paid-value').value)) || 0;
                let saldoPendiente = totalFila - abono;
                if (saldoPendiente < 0) saldoPendiente = 0;
                card.querySelector('.pending-value').value = formatearCop(saldoPendiente);
            }
        }
        calcularGlobales();
    }

    function manejarTipoPago(select) {
        const card = select.closest('.product-card');
        const bloqueCredito = card.querySelector('.dinamico-block');
        const selectPendiente = card.querySelector('.pending-type');
        const inputPaid = card.querySelector('.paid-value');
        const inputPending = card.querySelector('.pending-value');
        
        const totalFila = Math.round(parseFloat(card.querySelector('.prod-total').value.replace(/\./g, ''))) || 0;

        if (select.value === "Pendiente") {
            bloqueCredito.classList.add('visible-block');
            selectPendiente.value = "Pendiente total";
            inputPaid.value = 0;
            inputPaid.readOnly = true; 
            inputPending.value = formatearCop(totalFila);
        } else {
            bloqueCredito.classList.remove('visible-block');
            inputPaid.value = "";
            inputPending.value = "0";
            card.querySelector('.responsible-name').value = "";
        }
        calcularGlobales();
    }

    function manejarTipoPendiente(select) {
        const card = select.closest('.product-card');
        const inputPaid = card.querySelector('.paid-value');
        const inputPending = card.querySelector('.pending-value');
        const totalFila = Math.round(parseFloat(card.querySelector('.prod-total').value.replace(/\./g, ''))) || 0;

        if (select.value === "Pendiente total") {
            inputPaid.value = 0;
            inputPaid.readOnly = true;
            inputPending.value = formatearCop(totalFila);
        } else {
            inputPaid.value = "";
            inputPaid.readOnly = false;
            inputPending.value = formatearCop(totalFila);
            inputPaid.focus();
        }
        calcularGlobales();
    }

    function calcularValorDesdeAbono(input) {
        const card = input.closest('.product-card');
        const totalFila = Math.round(parseFloat(card.querySelector('.prod-total').value.replace(/\./g, ''))) || 0;
        const abono = Math.round(parseFloat(input.value)) || 0;
        
        let saldoPendiente = totalFila - abono;
        if(saldoPendiente < 0) saldoPendiente = 0;
        
        card.querySelector('.pending-value').value = formatearCop(saldoPendiente);
        calcularGlobales();
    }

    function calcularGlobales() {
        let granTotal = 0;
        let totalPendiente = 0;

        document.querySelectorAll('.product-card').forEach(card => {
            const totalFila = Math.round(parseFloat(card.querySelector('.prod-total').value.replace(/\./g, ''))) || 0;
            const tipoPago = card.querySelector('.pay-type').value;
            const vlrPendiente = Math.round(parseFloat(card.querySelector('.pending-value').value.replace(/\./g, ''))) || 0;

            granTotal += totalFila;

            if (tipoPago === "Pendiente") {
                totalPendiente += vlrPendiente;
            }
        });

        let totalPagado = granTotal - totalPendiente;

        document.getElementById('grand-total-val').innerText = formatearCop(granTotal);
        document.getElementById('float-total-val').innerText = formatearCop(granTotal);
        document.getElementById('total-pendiente-val').innerText = formatearCop(totalPendiente);
        document.getElementById('total-pagado-val').innerText = formatearCop(totalPagado);
    }

    const floatPopup = document.getElementById('popup-floating');
    const footerSection = document.getElementById('footer-section');
    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                floatPopup.classList.add('hidden');
            } else {
                floatPopup.classList.remove('hidden');
            }
        });
    }, { threshold: 0.1 });

    observer.observe(footerSection);

    async function enviarDatos() {
        const boton = document.getElementById('btn-enviar');
        const tarjetas = document.querySelectorAll('.product-card');
        let datosAEnviar = [];
        let validacionPasada = true;
        let tieneDatos = false;

        tarjetas.forEach((card, index) => {
            const producto = card.querySelector('.prod-name').value.trim();
            const precioStr = card.querySelector('.prod-price').value.trim();
            const cant = parseInt(card.querySelector('.prod-cant').value) || 1;
            
            const total = Math.round(parseFloat(card.querySelector('.prod-total').value.replace(/\./g, ''))) || 0;
            const tipoPago = card.querySelector('.pay-type').value;
            
            const tipoPendiente = tipoPago === "Pendiente" ? card.querySelector('.pending-type').value : "N/A";
            const abono = tipoPago === "Pendiente" ? (Math.round(parseFloat(card.querySelector('.paid-value').value)) || 0) : total;
            const vlrPendiente = tipoPago === "Pendiente" ? (Math.round(parseFloat(card.querySelector('.pending-value').value.replace(/\./g, ''))) || 0) : 0;
            const responsable = tipoPago === "Pendiente" ? card.querySelector('.responsible-name').value.trim() : "N/A";

            if ((producto && !precioStr) || (!producto && precioStr)) {
                alert(`Error en Producto #${index + 1}: Todo producto necesita precio y viceversa.`);
                validacionPasada = false; return;
            }

            if (producto && precioStr) {
                if (tipoPago === "Pendiente" && tipoPendiente === "Parcial" && abono > total) {
                    alert(`Error en Producto #${index + 1}: El abono no puede ser mayor que el subtotal.`);
                    validacionPasada = false; return;
                }
                
                if (tipoPago === "Pendiente" && !responsable) {
                    alert(`Error en Producto #${index + 1}: Si la cuenta queda Pendiente, debes escribir el Responsable.`);
                    validacionPasada = false; return;
                }

                tieneDatos = true;
                datosAEnviar.push({
                    producto: producto,
                    cantidad: cant,
                    precio_unitario: Math.round(parseFloat(precioStr)),
                    total: total,
                    tipo_pago: tipoPago,
                    tipo_pendiente: tipoPendiente,
                    valor_pendiente: vlrPendiente,
                    valor_pagado: abono,
                    responsable: responsable
                });
            }
        });

        if (!validacionPasada || !tieneDatos) {
            if(!tieneDatos) alert("Ingresa al menos un producto válido.");
            return;
        }

        boton.disabled = true;
        boton.innerText = "Enviando datos...";

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ventas: datosAEnviar, fecha: new Date().toLocaleString() })
            });

            alert("¡Venta registrada con éxito en Manjuh Market!");
            document.querySelectorAll('input:not(.prod-cant):not(.prod-total)').forEach(i => i.value = '');
            document.querySelectorAll('.prod-cant').forEach(i => i.value = '1');
            document.querySelectorAll('.prod-total').forEach(i => i.value = '0');
            document.querySelectorAll('.pay-type').forEach(s => { s.value = 'Efectivo'; manejarTipoPago(s); });
            calcularGlobales();

        } catch (error) {
            alert("Error de conexión al enviar.");
            console.error(error);
        } finally {
            boton.disabled = false;
            boton.innerText = "Enviar Venta";
        }
    }
</script>
</body>
</html>
